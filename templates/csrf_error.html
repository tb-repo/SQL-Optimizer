<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bs-primary: #2563eb;
            --bs-primary-rgb: 37, 99, 235;
            --modern-info: #0ea5e9;
            --modern-success: #22c55e;
            --modern-warning: #facc15;
            --modern-danger: #ef4444;
            --modern-muted: #6c757d;
            --modern-bg: #f8f9fa;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-primary: #111827;
            --bg-secondary: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --border-color: #374151;
            --card-bg: #1f2937;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .card {
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .section-header {
            background: var(--bs-primary);
            color: #fff;
            border-radius: 0.5rem 0.5rem 0 0;
            padding: 0.75rem 1rem;
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">SQL Optimizer</h1>
        <button id="dark-mode-toggle" class="btn btn-outline-secondary btn-sm" title="Toggle Dark Mode">
            <i class="fas fa-moon" id="dark-mode-icon"></i>
        </button>
    </div>
    <div class="card mx-auto" style="max-width: 480px;">
        <div class="section-header">Session Expired</div>
        <div class="card-body">
            <div class="alert alert-warning mb-3">
                <p class="mb-0">Your session has expired. Please reload the page or return to the home page to continue.</p>
            </div>
            <div class="d-flex gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Home</a>
                <button onclick="location.reload()" class="btn btn-secondary">Reload Page</button>
            </div>
        </div>
    </div>
</div>
<script>
// Simple dark mode toggle for consistency
const toggleBtn = document.getElementById('dark-mode-toggle');
const icon = document.getElementById('dark-mode-icon');
if (toggleBtn) {
    toggleBtn.onclick = function() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? '' : 'dark');
        icon.classList.toggle('fa-moon', isDark);
        icon.classList.toggle('fa-sun', !isDark);
    };
}
</script>
</body>
</html>
