{% extends "base.html" %}

{% block content %}
<div class="section-highlight analytics-highlight">
    <div class="section-highlight-header">
        <i class="fas fa-chart-line me-2"></i>
        <span class="section-highlight-title">Analytics Dashboard</span>
        <span class="section-highlight-subtitle">Query analysis statistics</span>
    </div>
    <div class="section-highlight-content">
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-bar me-2"></i>Queries Analyzed</h5>
                    </div>
                    <div class="card-body">
                        <h2 class="text-center">{{ analytics_data.get('queries_analyzed', 0) }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-database me-2"></i>Database Engines</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            {% for engine, count in analytics_data.get('engines', {}).items() %}
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                {{ engine }}
                                <span class="badge bg-primary rounded-pill">{{ count }}</span>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
